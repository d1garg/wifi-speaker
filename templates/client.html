<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Speaker Client</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0d0d;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            padding: 35px 25px;
            border-radius: 16px;
            border: 1px solid #333;
            max-width: 320px;
            width: 85%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        button {
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            background: #2979ff;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>WiFi Receiver</h3>
        <button id="connectBtn" onclick="initAudio()">Tap to Listen</button>
        <p id="status">Disconnected</p>
    </div>

    <script>
        const socket = io();
        let audioCtx = null;
        let nextStartTime = 0;
        let serverRate = 44100;
        let serverChannels = 2;
        let isStarted = false;

        socket.on('audio_config', (config) => {
            if (config && config.rate) {
                serverRate = config.rate;
                serverChannels = config.channels;
            }
        });

        function initAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: serverRate
                });

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                isStarted = true;
                nextStartTime = 0;

                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('status').innerText = "Streaming Smooth Audio...";
                document.getElementById('status').style.color = "#00e676";
            } catch (e) {
                document.getElementById('status').innerText = "Error: " + e.message;
            }
        }

        socket.on('audio_stream', (data) => {
            if (!audioCtx || !isStarted) return;

            try {
                const int16 = new Int16Array(data);
                const numFrames = int16.length / serverChannels;
                if (numFrames <= 0) return;

                const buffer = audioCtx.createBuffer(serverChannels, numFrames, serverRate);

                if (serverChannels === 2) {
                    const left = buffer.getChannelData(0);
                    const right = buffer.getChannelData(1);
                    for (let i = 0; i < numFrames; i++) {
                        left[i] = int16[i * 2] / 32768.0;
                        right[i] = int16[i * 2 + 1] / 32768.0;
                    }
                } else {
                    const mono = buffer.getChannelData(0);
                    for (let i = 0; i < numFrames; i++) {
                        mono[i] = int16[i] / 32768.0;
                    }
                }

                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);

                const currentTime = audioCtx.currentTime;

                // --- STABLE JITTER BUFFER TIMELINE ---
                // Agar pehla packet hai ya gap aa gaya to 80ms ka safety buffer do
                if (nextStartTime < currentTime) {
                    nextStartTime = currentTime + 0.08;
                }

                // Agar delay 0.35s (350ms) se zyada build hone lage tabhi adjust karo
                if ((nextStartTime - currentTime) > 0.35) {
                    nextStartTime = currentTime + 0.08;
                }

                source.start(nextStartTime);
                nextStartTime += buffer.duration;

            } catch (err) {
                console.error("Audio error:", err);
            }
        });
    </script>
</body>
</html>
